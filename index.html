<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Drag the Apple</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one 16:9 garden stage. Apple on the left, basket on the right, big dashed drop ring.
   Everything is placed in percentages so it scales from a laptop to a classroom screen. Single bright look by design. */
:root {
  --ink: #2b2a55;
  --ink-soft: #5b5a85;
  --sky: #cfeeff;
  --go: #2fbf71;
  --go-dark: #1f9a58;
  --cta: #ff6f91;
  --cta-dark: #e04f75;
  --blue: #4d7cff;
  --blue-dark: #3459d1;
  --try: #ff9a3c;
  --font: 'Fredoka', 'Baloo 2', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; font-family: var(--font); font-size: 18px; color: var(--ink);
  background: linear-gradient(180deg, #cfeeff 0%, #e8f7ff 55%, #c9f4dd 100%);
  background-color: #d9f1ff; background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 36px; overflow-x: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; }
h1, h2, p { margin: 0; }
main { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
.top { text-align: center; font-size: clamp(1.5rem, 4.4vw, 2.9rem); font-weight: 700; color: var(--blue-dark); text-shadow: 0 4px 0 rgba(255,255,255,.9); text-wrap: balance; padding: 0 56px; }

/* stage */
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 32px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 12px 0 rgba(59,74,140,.2); background: #bfe9ff; }
.layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.cloud { animation: cloud 16s ease-in-out infinite alternate; }
.cloud.c2 { animation-duration: 22s; animation-delay: -6s; }
.cloud.c3 { animation-duration: 19s; animation-delay: -11s; }
.rays { transform-box: fill-box; transform-origin: center; animation: spin 40s linear infinite; }
.flower { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3.4s ease-in-out infinite; }
@keyframes cloud { from { transform: translateX(-70px); } to { transform: translateX(110px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes dash { to { stroke-dashoffset: -40; } }
@keyframes zonepulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
@keyframes applepulse { 0%,100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.07); } }
@keyframes ring { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }
@keyframes spark { from { transform: translate(-50%, -50%) scale(.2) rotate(0); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(200deg); opacity: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes face { 0% { opacity: 0; transform: scale(.5); } 70% { transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }

/* hint arrow and drop ring */
#hint { z-index: 1; transition: opacity .3s; }
#hint.off { opacity: 0; }
#hint path.march { stroke-dasharray: 18 22; animation: dash 1.1s linear infinite; }
.zone {
  position: absolute; left: 58.5%; top: 27%; width: 37%; height: 44%; z-index: 5; pointer-events: none;
  border: clamp(4px, .7vw, 7px) dashed rgba(255,255,255,.95); border-radius: 50%;
  background: rgba(255,255,255,.16); opacity: 0; transition: opacity .25s, background .2s, border-color .2s, transform .2s;
  display: flex; justify-content: center; align-items: flex-start;
}
.zone.show { opacity: 1; animation: zonepulse 1.7s ease-in-out infinite; }
.zone.hot { border-color: #2fbf71; background: rgba(47,191,113,.3); animation: none; transform: scale(1.04); }
.zone span { margin-top: -4.2%; background: #fff; color: var(--blue-dark); font-weight: 700; font-size: clamp(.8rem, 2vw, 1.5rem); padding: .1em .8em; border-radius: 999px; box-shadow: 0 4px 0 rgba(59,74,140,.18); }
.zone.hot span { background: var(--go); color: #fff; }

/* basket */
.basket { position: absolute; left: 62%; top: 46%; width: 30%; aspect-ratio: 300 / 240; }
.bk { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
.bk.back { z-index: 2; }
.bk.front { z-index: 4; }
.bk .face { opacity: 0; transform-box: fill-box; transform-origin: center; }
.basket.happy .face { animation: face .6s forwards; }

/* apple */
.apple {
  position: absolute; z-index: 3; width: 15%; aspect-ratio: 1; left: 17%; top: 62%;
  transform: translate(-50%, -50%); touch-action: none; cursor: grab; outline: none;
  -webkit-touch-callout: none; filter: drop-shadow(0 8px 6px rgba(0,0,0,.18));
}
.apple svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.apple.pulse { animation: applepulse 1.4s ease-in-out infinite; }
.apple:focus-visible { outline: 5px solid var(--ink); outline-offset: 6px; border-radius: 50%; }
.apple.dragging { z-index: 20; cursor: grabbing; transform: translate(-50%, -50%) scale(1.12) rotate(-6deg); filter: drop-shadow(0 20px 12px rgba(0,0,0,.28)); animation: none; }
.apple.returning { transition: left .75s cubic-bezier(.3,1.35,.5,1), top .75s cubic-bezier(.3,1.35,.5,1); }
.apple.ghost { pointer-events: none; visibility: hidden; }
.apple.ghost.dragging { cursor: default; }

/* demo cursor */
#cursor { position: absolute; z-index: 30; width: clamp(34px, 5.2vw, 56px); pointer-events: none; display: none; transition: transform .15s; transform-origin: 0 0; filter: drop-shadow(0 4px 3px rgba(0,0,0,.3)); }
#cursor.down { transform: scale(.82); }
#cursor svg { width: 100%; display: block; }
#ripple { position: absolute; z-index: 29; width: clamp(60px, 9vw, 100px); aspect-ratio: 1; border-radius: 50%; border: 6px solid #ff6f91; pointer-events: none; display: none; transform: translate(-50%, -50%); }
#ripple.go { display: block; animation: ring .6s ease-out forwards; }
.spark { position: absolute; z-index: 35; width: clamp(24px, 4vw, 44px); pointer-events: none; animation: spark 1.1s ease-out forwards; }
.spark svg { width: 100%; display: block; }

/* caption, fail, overlays */
#caption {
  position: absolute; z-index: 25; top: 3%; left: 50%; transform: translateX(-50%); max-width: 92%;
  background: rgba(255,255,255,.95); border-radius: 999px; padding: .25em 1em; text-align: center;
  font-size: clamp(1.05rem, 2.7vw, 2.2rem); font-weight: 700; color: var(--ink); box-shadow: 0 6px 0 rgba(59,74,140,.18);
  animation: fadein .3s;
}
#fail { position: absolute; z-index: 26; left: 50%; top: 22%; transform: translateX(-50%); display: grid; justify-items: center; gap: 12px; background: #fff; border: 6px solid var(--try); border-radius: 32px; padding: 16px clamp(18px, 4vw, 40px); box-shadow: 0 10px 0 rgba(194,94,0,.25); animation: pop .4s; }
#fail p { font-size: clamp(1.4rem, 3.8vw, 2.6rem); font-weight: 700; color: #c25e00; text-align: center; }
.overlay { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 12px; pointer-events: none; }
.overlay .box { pointer-events: auto; background: #fff; border-radius: 36px; padding: clamp(14px, 3vw, 34px) clamp(18px, 5vw, 56px); display: grid; justify-items: center; gap: clamp(6px, 1.4vw, 14px); box-shadow: 0 12px 0 rgba(59,74,140,.2); text-align: center; max-width: 94%; animation: pop .5s; }
#win .box { border: 8px solid var(--go); box-shadow: 0 14px 0 rgba(31,154,88,.3); }
#intro { background: rgba(207,238,255,.55); }
#intro h2 { font-size: clamp(1.5rem, 4.6vw, 3rem); color: var(--blue-dark); text-wrap: balance; }
#intro p { font-size: clamp(1rem, 2.6vw, 1.7rem); font-weight: 500; color: var(--ink-soft); text-wrap: balance; }
.tick { width: clamp(70px, 14vw, 130px); height: auto; }
.tick path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s .2s forwards; }
.well { font-size: clamp(2rem, 7vw, 4.2rem); font-weight: 700; color: var(--go-dark); line-height: 1; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 12px 34px;
  border: 0; border-radius: 999px; font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 700; letter-spacing: .02em;
  color: #fff; cursor: pointer; background: var(--blue); box-shadow: 0 7px 0 var(--blue-dark); transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 9px 0 var(--blue-dark); }
.btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--blue-dark); }
.btn:focus-visible, #muteBtn:focus-visible { outline: 5px solid var(--ink); outline-offset: 3px; }
.btn.go { background: var(--go); box-shadow: 0 7px 0 var(--go-dark); } .btn.go:hover { box-shadow: 0 9px 0 var(--go-dark); } .btn.go:active { box-shadow: 0 2px 0 var(--go-dark); }
.btn.cta { background: var(--cta); box-shadow: 0 7px 0 var(--cta-dark); } .btn.cta:hover { box-shadow: 0 9px 0 var(--cta-dark); } .btn.cta:active { box-shadow: 0 2px 0 var(--cta-dark); }
.btn.try { background: var(--try); box-shadow: 0 7px 0 #c25e00; } .btn.try:hover { box-shadow: 0 9px 0 #c25e00; } .btn.try:active { box-shadow: 0 2px 0 #c25e00; }
.btn.plain { background: #fff; color: var(--ink); box-shadow: 0 7px 0 #c6cbe8; } .btn.plain:hover { box-shadow: 0 9px 0 #c6cbe8; } .btn.plain:active { box-shadow: 0 2px 0 #c6cbe8; }
.bar { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
#muteBtn { position: fixed; z-index: 60; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); min-height: 48px; padding: 6px 18px; font-size: 1rem; border-radius: 999px; border: 3px solid #3b4a8c; background: #fff; color: var(--ink); font-weight: 600; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

<canvas id="confetti" aria-hidden="true"></canvas>
<button id="muteBtn" type="button" aria-pressed="false">Sound: ON</button>

<main>
  <h1 class="top">Drag the apple into the basket!</h1>

  <div class="stage" id="stage">
    <svg class="layer" id="scene" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fcfff"/><stop offset="1" stop-color="#d9f4ff"/></linearGradient>
        <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd45f"/><stop offset="1" stop-color="#4cb84a"/></linearGradient>
      </defs>
      <rect width="1600" height="900" fill="url(#gSky)"/>
      <g transform="translate(1390 140)"><g class="rays" stroke="#ffd93d" stroke-width="14" stroke-linecap="round">
        <line x1="0" y1="-110" x2="0" y2="-150"/><line x1="0" y1="110" x2="0" y2="150"/><line x1="-110" y1="0" x2="-150" y2="0"/><line x1="110" y1="0" x2="150" y2="0"/>
        <line x1="78" y1="78" x2="106" y2="106"/><line x1="-78" y1="-78" x2="-106" y2="-106"/><line x1="78" y1="-78" x2="106" y2="-106"/><line x1="-78" y1="78" x2="-106" y2="106"/></g>
        <circle r="84" fill="#ffe14d"/><circle r="84" fill="none" stroke="#ffc400" stroke-width="6"/>
        <circle cx="-26" cy="-8" r="8" fill="#2b2a55"/><circle cx="26" cy="-8" r="8" fill="#2b2a55"/><path d="M-30 24 Q0 52 30 24" fill="none" stroke="#2b2a55" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="-46" cy="18" rx="12" ry="8" fill="#ff9fb0" opacity=".7"/><ellipse cx="46" cy="18" rx="12" ry="8" fill="#ff9fb0" opacity=".7"/></g>
      <g class="cloud c1" fill="#fff"><ellipse cx="260" cy="150" rx="120" ry="42"/><circle cx="210" cy="125" r="48"/><circle cx="290" cy="112" r="58"/></g>
      <g class="cloud c2" fill="#fff"><ellipse cx="760" cy="90" rx="100" ry="34"/><circle cx="720" cy="68" r="40"/><circle cx="790" cy="58" r="48"/></g>
      <g class="cloud c3" fill="#fff"><ellipse cx="1080" cy="250" rx="90" ry="30"/><circle cx="1045" cy="232" r="34"/><circle cx="1105" cy="224" r="42"/></g>
      <path d="M0 540 Q260 400 560 500 T1160 470 T1600 500 V900 H0 Z" fill="#b6ec96"/>
      <path d="M0 590 Q380 480 800 570 T1600 545 V900 H0 Z" fill="#8fe070"/>
      <rect y="600" width="1600" height="300" fill="url(#gGround)"/>
      <g fill="#7be06a" opacity=".7"><ellipse cx="420" cy="660" rx="150" ry="14"/><ellipse cx="1000" cy="700" rx="200" ry="16"/><ellipse cx="760" cy="840" rx="220" ry="16"/><ellipse cx="200" cy="820" rx="140" ry="12"/><ellipse cx="1420" cy="860" rx="150" ry="12"/></g>
      <g id="trees"></g>
      <ellipse cx="272" cy="690" rx="115" ry="17" fill="rgba(0,60,0,.18)"/>
      <ellipse cx="1232" cy="800" rx="215" ry="22" fill="rgba(0,60,0,.2)"/>
      <g id="flowers"></g>
    </svg>

    <svg class="layer" id="hint" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
      <defs><marker id="arrowHead" viewBox="0 0 20 20" refX="14" refY="10" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 2 L18 10 L2 18 Z" fill="#fff"/></marker></defs>
      <path class="march" d="M430 410 Q700 170 925 360" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" marker-end="url(#arrowHead)"/>
    </svg>

    <div class="basket" id="basket" aria-hidden="true">
      <svg class="bk back" viewBox="0 0 300 240">
        <path d="M52 84 Q52 -6 150 -6 Q248 -6 248 84" fill="none" stroke="#8a4b1c" stroke-width="16" stroke-linecap="round"/>
        <path d="M52 84 Q52 0 150 0 Q248 0 248 84" fill="none" stroke="#c98543" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 14"/>

          <path d="M60 90 L70 240"/><path d="M100 100 L106 240"/><path d="M150 112 L150 240"/><path d="M200 100 L194 240"/><path d="M240 90 L230 240"/>

        <path d="M26 80 Q150 134 274 80" fill="none" stroke="#8a4b1c" stroke-width="16" stroke-linecap="round"/>

    <div class="zone" id="zone" aria-hidden="true"><span>DROP HERE</span></div>

    <div class="apple" id="apple" role="button" tabindex="0" aria-label="Red apple. Drag it into the basket with the mouse or your finger."></div>

      <button class="btn try" id="failBtn" type="button">TRY AGAIN</button>

    <div class="overlay" id="intro">

</main>

<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function starPts(cx, cy, R, r) { var p = []; for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; p.push((cx + rad * Math.cos(a)).toFixed(1) + ',' + (cy + rad * Math.sin(a)).toFixed(1)); } return p.join(' '); }

var stage = $('stage'), apple = $('apple'), ghost = $('ghost'), zone = $('zone'), basket = $('basket'), hint = $('hint');

var HOME = { x: .17, y: .62 };
var state = 'intro';          // intro | demo | ready | dragging | returning | dropping | done
var demoTok = 0, dragId = null, grab = { dx: 0, dy: 0 }, lastHot = false, muted = false;

/* ---------- apple art ---------- */
var aid = 0;
function appleSVG() {
  var id = 'ap' + (++aid);
  return '<svg viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="' + id + '" cx=".38" cy=".35" r=".8"><stop offset="0" stop-color="#ff7a6e"/><stop offset=".5" stop-color="#ff3b3b"/><stop offset="1" stop-color="#c9121c"/></radialGradient></defs>' +
    '<path d="M100 14 Q96 34 100 58" fill="none" stroke="#6b3a16" stroke-width="10" stroke-linecap="round"/>' +
    '<path d="M106 38 Q140 8 170 28 Q140 56 106 38 Z" fill="#4fcf5a" stroke="#2c8a3a" stroke-width="4" stroke-linejoin="round"/>' +
    '<path d="M100 58 C70 32 20 46 20 106 C20 162 60 192 100 184 C140 192 180 162 180 106 C180 46 130 32 100 58 Z" fill="url(#' + id + ')" stroke="#a50f15" stroke-width="5" stroke-linejoin="round"/>' +
    '<ellipse cx="58" cy="86" rx="13" ry="24" transform="rotate(18 58 86)" fill="#fff" opacity=".5"/>' +
    '<ellipse cx="76" cy="112" rx="8" ry="11" fill="#2b2a55"/><ellipse cx="124" cy="112" rx="8" ry="11" fill="#2b2a55"/>' +
    '<circle cx="79" cy="107" r="3.2" fill="#fff"/><circle cx="127" cy="107" r="3.2" fill="#fff"/>' +
    '<ellipse cx="58" cy="136" rx="13" ry="8" fill="#ff9fb0" opacity=".75"/><ellipse cx="142" cy="136" rx="13" ry="8" fill="#ff9fb0" opacity=".75"/>' +
    '<path d="M84 136 Q100 156 116 136 Z" fill="#a50f15" stroke="#2b2a55" stroke-width="4" stroke-linejoin="round"/></svg>';
}

/* ---------- scene decoration ---------- */
function seeded(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function tree(x, y, s) {
  var o = '<g>';
  o += '<rect x="' + (x - 20 * s) + '" y="' + (y - 190 * s) + '" width="' + 40 * s + '" height="' + 190 * s + '" rx="' + 10 * s + '" fill="#a8652e"/>';
  o += '<circle cx="' + x + '" cy="' + (y - 250 * s) + '" r="' + 120 * s + '" fill="#45b84f"/><circle cx="' + (x - 90 * s) + '" cy="' + (y - 200 * s) + '" r="' + 84 * s + '" fill="#4cc356"/><circle cx="' + (x + 90 * s) + '" cy="' + (y - 205 * s) + '" r="' + 84 * s + '" fill="#4cc356"/>';
  o += '<circle cx="' + (x - 34 * s) + '" cy="' + (y - 292 * s) + '" r="' + 52 * s + '" fill="#6fdc6a" opacity=".75"/>';
  [[-60, -240], [40, -290], [80, -210], [-110, -190], [0, -190]].forEach(function (p) { o += '<circle cx="' + (x + p[0] * s) + '" cy="' + (y + p[1] * s) + '" r="' + 13 * s + '" fill="#ff4545" stroke="#b81620" stroke-width="3"/>'; });

}
function buildScene() {
  $('trees').innerHTML = tree(120, 620, 1.05) + tree(1500, 640, 1.15) + tree(690, 585, .55);
  var r = seeded(7), cols = ['#ff6f91', '#ffd23d', '#ffffff', '#b79bff', '#ff9a3c', '#6fb7ff'], out = [], i;
  for (i = 0; i < 34; i++) out.push({ x: 30 + r() * 1540, y: 640 + r() * 230, s: .7 + r() * .6, c: cols[Math.floor(r() * cols.length)], d: r() * 3 });

    h += '<g class="flower" style="animation-delay:-' + f.d.toFixed(2) + 's"><path d="M' + x + ' ' + y + ' Q' + (f.x + 8) + ' ' + (f.y + 30 * s) + ' ' + x + ' ' + (f.y + 58 * s) + '" fill="none" stroke="#2f9a45" stroke-width="' + (5 * s).toFixed(1) + '" stroke-linecap="round"/>' +
      '<ellipse cx="' + (f.x + 14 * s) + '" cy="' + (f.y + 38 * s) + '" rx="' + 12 * s + '" ry="' + 6 * s + '" fill="#43b85a"/>' + p + '<circle cx="' + x + '" cy="' + y + '" r="' + (8 * s).toFixed(1) + '" fill="#ffd23d" stroke="#e0a000" stroke-width="2"/></g>';

  apple.innerHTML = appleSVG(); ghost.innerHTML = appleSVG();
}

/* ---------- sound ---------- */
var ac = null, noiseBuf = null;
function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } if (ac && ac.state === 'suspended') { try { ac.resume(); } catch (e) {} } return ac; }

  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(g || .2, t + .02); a.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(a); a.connect(c.destination); o.start(t); o.stop(t + d + .05);
}
function hit(t0, d, g, freq) {
  var c = ctx(); if (!c || muted) return;
  if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate); var data = noiseBuf.getChannelData(0); for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1; }

var sfx = {
  pick: function () { tone(660, 0, .1, 'triangle', .14); tone(880, .06, .12, 'triangle', .1); },
  thud: function () { tone(130, 0, .22, 'sine', .35); hit(0, .08, .18, 500); },
  wrong: function () { tone(330, 0, .25, 'sine', .12); tone(262, .18, .4, 'sine', .12); },
  correct: function () { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) { tone(f, i * .09, .4, 'triangle', .22); }); },
  clap: function () { for (var i = 0; i < 20; i++) hit(i * .07 + Math.random() * .04, .07, Math.max(.05, .26 - i * .011), 1500 + Math.random() * 1500); },
  celebrate: function () {
    [[523, 0, .2], [659, .2, .2], [784, .4, .2], [1047, .6, .45], [784, 1.1, .2], [1047, 1.3, .2], [1319, 1.5, .6]].forEach(function (n) { tone(n[0], n[1], n[2] + .15, 'triangle', .2); tone(n[0] / 2, n[1], n[2] + .15, 'sine', .1); });
  }
};
function speak(t) { if (muted || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.rate = .85; u.pitch = 1.15; speechSynthesis.speak(u); } catch (e) {} }
function say(t, voice) { caption.textContent = t; caption.hidden = !t; if (t && voice) speak(t); }

/* ---------- confetti and sparkles ---------- */
var cv = $('confetti'), cx = cv.getContext('2d'), parts = [], raf = 0, CC = ['#ff6f91', '#ffc83d', '#4fd1a0', '#5aaeff', '#a88cff', '#ff9a3c'];
function sizeCv() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
window.addEventListener('resize', sizeCv); sizeCv();
function burst(n, x, y) {
  if (reduceMotion) n = Math.ceil(n / 4);
  for (var i = 0; i < n; i++) { var a = -Math.PI / 2 + (Math.random() - .5) * 3, v = rand(6, 17); parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .32, s: rand(7, 15), r: rand(0, 6.28), vr: rand(-.3, .3), c: CC[i % CC.length], star: Math.random() < .3 }); }
  if (!raf) loop();
}
function rain(n) {
  if (reduceMotion) n = Math.ceil(n / 4);
  for (var i = 0; i < n; i++) parts.push({ x: rand(0, cv.width), y: rand(-cv.height * .5, -10), vx: rand(-1.5, 1.5), vy: rand(2, 5), g: .04, s: rand(7, 14), r: rand(0, 6.28), vr: rand(-.2, .2), c: CC[i % CC.length], star: Math.random() < .25 });
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(function (p) { return p.y < cv.height + 30; });
  parts.forEach(function (p) {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .992; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if (p.star) { cx.beginPath(); for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? p.s * .45 : p.s; cx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); } cx.closePath(); cx.fill(); } else cx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * .66);
    cx.restore();

  if (parts.length) raf = requestAnimationFrame(loop); else { raf = 0; cx.clearRect(0, 0, cv.width, cv.height); }
}
function sparkles(x, y) {
  var n = reduceMotion ? 3 : 12;
  for (var i = 0; i < n; i++) {
    var d = document.createElement('div'), a = i / n * Math.PI * 2, dist = rand(.1, .2) * stage.clientWidth;
    d.className = 'spark'; d.innerHTML = starSVG(i % 2 ? '#ffd23d' : '#fff27a');
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.style.setProperty('--dx', (Math.cos(a) * dist).toFixed(0) + 'px'); d.style.setProperty('--dy', (Math.sin(a) * dist).toFixed(0) + 'px');
    stage.appendChild(d); setTimeout(function (el) { el.remove(); }.bind(null, d), 1200);
  }
}

/* ---------- geometry ---------- */
function SW() { return stage.clientWidth; } function SH() { return stage.clientHeight; }
function setPos(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
function resetHome(el) { el.style.left = (HOME.x * 100) + '%'; el.style.top = (HOME.y * 100) + '%'; }
function centerOf(el) { var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: r.left + r.width / 2 - s.left, y: r.top + r.height / 2 - s.top }; }
function inZone(x, y) {
  var z = zone.getBoundingClientRect(), s = stage.getBoundingClientRect();
  var cxz = z.left + z.width / 2 - s.left, cyz = z.top + z.height / 2 - s.top, a = z.width / 2, b = z.height / 2;
  return Math.pow((x - cxz) / a, 2) + Math.pow((y - cyz) / b, 2) <= 1;
}
function basketRest() { var b = basket.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: b.left - s.left + b.width * .5, y: b.top - s.top + b.height * .34 }; }
function zoneCenter() { var z = zone.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: z.left + z.width / 2 - s.left, y: z.top + z.height / 2 - s.top }; }

/* drop the apple into the basket with gravity and a little bounce */
function dropInto(el, x, y, tok) {
  return new Promise(function (resolve) {
    var r = basketRest(), vy = 0, bounces = 0, last = performance.now(), H = SH(), g = H * 4.2;
    el.style.zIndex = '3';
    function step(t) {
      if (tok !== undefined && tok !== demoTok) { resolve(false); return; }
      var dt = Math.min(.033, (t - last) / 1000); last = t;
      x += (r.x - x) * Math.min(1, dt * 9);
      vy += g * dt; y += vy * dt;
      if (y >= r.y) {
        y = r.y; vy = -vy * .36; bounces++;

        if (bounces >= 3 || Math.abs(vy) < H * .35) { setPos(el, r.x, r.y); resolve(true); return; }

    }
    requestAnimationFrame(step);
  });

/* ---------- the guided demo (a pretend apple and cursor, the real apple stays put) ---------- */
function sleep(ms) { return new Promise(function (res) { var tok = demoTok; setTimeout(function () { res(tok === demoTok); }, ms); }); }
function tween(ms, fn, ease) {
  return new Promise(function (res) {
    var tok = demoTok, t0 = performance.now();
    (function f(t) {
      if (tok !== demoTok) { res(false); return; }
      var p = Math.min(1, (t - t0) / ms); fn(ease ? ease(p) : p);

    })(t0);
  });
}
function inOut(p) { return p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
function setCursor(x, y) { cursor.style.left = x + 'px'; cursor.style.top = y + 'px'; }
function ping(x, y) { ripple.classList.remove('go'); void ripple.offsetWidth; ripple.style.left = x + 'px'; ripple.style.top = y + 'px'; ripple.classList.add('go'); }
function endDemoUI() {
  cursor.style.display = 'none'; cursor.classList.remove('down'); ripple.classList.remove('go');
  ghost.style.visibility = 'hidden'; ghost.classList.remove('dragging'); ghost.style.zIndex = ''; resetHome(ghost);
  $('skipBtn').hidden = true; $('watchBtn').hidden = false; $('tryBtn').hidden = false;
}
function runDemo() {
  demoTok++; var tok = demoTok;
  resetBoard(true);
  state = 'demo';
  apple.style.visibility = 'hidden'; zone.classList.remove('show'); hint.classList.add('off');
  $('skipBtn').hidden = false; $('watchBtn').hidden = true; $('tryBtn').hidden = true;
  var W = SW(), H = SH(), A = { x: HOME.x * W, y: HOME.y * H }, Z = zoneCenter();
  ghost.style.visibility = 'visible'; resetHome(ghost);
  cursor.style.display = 'block'; setCursor(.5 * W, .92 * H);
  (async function () {
    say('Watch me!', true); if (!await sleep(1300)) return;
    var from = { x: .5 * W, y: .92 * H };
    if (!await tween(1500, function (p) { setCursor(from.x + (A.x - from.x) * p, from.y + (A.y - from.y) * p); }, inOut)) return;
    say('Press and HOLD the left mouse button.', true); cursor.classList.add('down'); ping(A.x, A.y); sfx.pick(); ghost.classList.add('dragging');
    if (!await sleep(2600)) return;
    say('Keep holding. Move the apple to the basket.', true);
    if (!await tween(2600, function (p) { var x = A.x + (Z.x - A.x) * p, y = A.y + (Z.y - A.y) * p - Math.sin(Math.PI * p) * .12 * H; setCursor(x, y); setPos(ghost, x, y); }, inOut)) return;

    cursor.classList.remove('down'); ghost.classList.remove('dragging'); zone.classList.remove('hot', 'show'); ping(Z.x, Z.y);
    var ok = await dropInto(ghost, Z.x, Z.y, tok); if (!ok) return;
    say('It dropped in the basket!', true); if (!await sleep(1800)) return;

function skipDemo() { demoTok++; endDemoUI(); beginPlay(false); }

/* ---------- the game ---------- */
function resetBoard() {
  failBox.hidden = true; $('win').hidden = true; $('intro').hidden = true;
  basket.classList.remove('happy');
  apple.classList.remove('dragging', 'returning', 'pulse'); apple.style.zIndex = ''; apple.style.visibility = ''; apple.style.opacity = '';
  resetHome(apple); lastHot = false; zone.classList.remove('hot');
}
function beginPlay(afterDemo) {
  demoTok++; endDemoUI(); resetBoard();
  state = 'ready'; zone.classList.add('show'); hint.classList.remove('off'); apple.classList.add('pulse');
  say(afterDemo ? "Now it's YOUR turn! Drag the apple to the basket." : 'Drag the apple into the basket!', true);
}

apple.addEventListener('pointerdown', function (e) {
  if (state !== 'ready') return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  try { apple.setPointerCapture(e.pointerId); } catch (err) {}

  grab.dx = c.x - (e.clientX - s.left); grab.dy = c.y - (e.clientY - s.top);

  say('Keep holding and drag it to the basket!', false); sfx.pick();

apple.addEventListener('pointermove', function (e) {
  if (state !== 'dragging' || e.pointerId !== dragId) return;
  if (e.pointerType === 'mouse' && !(e.buttons & 1)) { release(); return; }
  var s = stage.getBoundingClientRect();
  var x = clamp(e.clientX - s.left + grab.dx, 0, SW()), y = clamp(e.clientY - s.top + grab.dy, 0, SH());
  setPos(apple, x, y);
  var hot = inZone(x, y);
  if (hot !== lastHot) { lastHot = hot; zone.classList.toggle('hot', hot); say(hot ? 'Let go now!' : 'Keep holding and drag it to the basket!', hot); }
});
function release() {
  if (state !== 'dragging') return;
  try { apple.releasePointerCapture(dragId); } catch (err) {}
  var c = centerOf(apple);
  apple.classList.remove('dragging'); zone.classList.remove('hot', 'show'); lastHot = false;
  if (inZone(c.x, c.y)) success(c); else fail();
}
apple.addEventListener('pointerup', function (e) { if (e.pointerId === dragId) release(); });
apple.addEventListener('pointercancel', function (e) { if (e.pointerId === dragId && state === 'dragging') { apple.classList.remove('dragging'); zone.classList.remove('hot', 'show'); fail(); } });
apple.addEventListener('contextmenu', function (e) { e.preventDefault(); });
apple.addEventListener('dragstart', function (e) { e.preventDefault(); });

function success(c) {
  state = 'dropping'; say('', false);
  dropInto(apple, c.x, c.y).then(function () {
    state = 'done';
    basket.classList.add('happy');
    var b = basketRest(), W = SW();
    sparkles(b.x, b.y);
    var s = stage.getBoundingClientRect();
    sfx.correct(); setTimeout(sfx.clap, 350); setTimeout(sfx.celebrate, 700);
    burst(90, s.left + b.x, s.top + b.y); setTimeout(function () { rain(90); }, 400);
    setTimeout(function () { if (state !== 'done') return; sparkles(b.x - W * .12, b.y); sparkles(b.x + W * .12, b.y); }, 500);
    setTimeout(function () { if (state !== 'done') return; $('win').hidden = false; speak('Well done!'); }, 1100);
  });
}
function fail() {
  state = 'returning'; sfx.wrong(); say('', false);
  failBox.hidden = false; speak('Oops! Try again!');
  apple.classList.add('returning'); resetHome(apple);
  setTimeout(function () {
    if (state !== 'returning') return;
    apple.classList.remove('returning'); apple.classList.add('pulse');
    state = 'ready'; zone.classList.add('show'); hint.classList.remove('off');
  }, 800);
}
function tryAgain() { beginPlay(false); }

/* ---------- wiring ---------- */
$('startBtn').addEventListener('click', function () { ctx(); sfx.pick(); $('intro').hidden = true; runDemo(); });
$('watchBtn').addEventListener('click', function () { ctx(); runDemo(); });
$('skipBtn').addEventListener('click', skipDemo);
$('tryBtn').addEventListener('click', tryAgain);
$('failBtn').addEventListener('click', tryAgain);
$('playBtn').addEventListener('click', tryAgain);
$('muteBtn').addEventListener('click', function () {
  muted = !muted; $('muteBtn').textContent = 'Sound: ' + (muted ? 'OFF' : 'ON'); $('muteBtn').setAttribute('aria-pressed', String(muted));
  if (muted) { try { speechSynthesis.cancel(); } catch (e) {} }

window.addEventListener('resize', function () { if (state === 'done') { var r = basketRest(); setPos(apple, r.x, r.y); } });
buildScene();
})();
</script>
